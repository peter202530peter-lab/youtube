<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextStream | Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .blob { position: absolute; z-index: -1; filter: blur(120px); border-radius: 50%; }
    </style>
</head>
<body class="min-h-screen text-white flex items-center justify-center p-4 relative overflow-hidden">
    <div class="blob w-[400px] h-[400px] bg-purple-600 top-0 left-0 opacity-50"></div>
    <div class="blob w-[400px] h-[400px] bg-blue-600 bottom-0 right-0 opacity-50"></div>

    <main class="w-full max-w-3xl relative z-10 glass rounded-[2.5rem] p-8 shadow-2xl">
        <h1 class="text-4xl font-black text-center mb-8">NextStream</h1>
        
        <div class="relative flex">
            <input type="text" id="videoUrl" placeholder="رابط الفيديو هنا..." class="w-full bg-white/5 border border-white/10 rounded-xl py-4 px-4 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="analyzeVideo()" class="mr-2 bg-blue-500 text-white px-8 py-4 rounded-xl font-bold hover:bg-blue-600">تحليل</button>
        </div>

        <div id="previewArea" class="hidden mt-8 pt-8 border-t border-white/10 flex gap-6">
            <img id="thumbImg" src="" class="w-1/2 rounded-xl object-cover h-48">
            <div class="w-1/2 flex flex-col gap-4">
                <h3 id="videoTitle" class="text-xl font-bold truncate"></h3>
                <div id="linksArea" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        async function analyzeVideo() {
            const urlInput = document.getElementById('videoUrl').value;
            if (!urlInput) return;

            // غتبدل هاد الرابط بالرابط ديال السيرفر ديالك من بعد (Render أو Railway)
            const apiUrl = 'https://youtube-production-a79c.up.railway.app/analyze'; 
            
            document.getElementById('videoTitle').innerText = "جاري التحميل...";
            document.getElementById('previewArea').classList.remove('hidden');

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                const data = await response.json();
                
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('thumbImg').src = data.thumbnail;
                
                const linksHtml = data.formats.map(f => `
                    <a href="${f.url}" target="_blank" class="p-3 bg-white/10 rounded-lg text-center hover:bg-blue-500 transition-all">
                        تحميل ${f.res}
                    </a>
                `).join('');
                document.getElementById('linksArea').innerHTML = linksHtml;

            } catch (err) {
                document.getElementById('videoTitle').innerText = "خطأ في التحميل!";
            }
        }
    </script>
</body>
</html>
